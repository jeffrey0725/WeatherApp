# XcodeGen source of truth. Regenerate with: bash scripts/generate-project.sh
name: WeatherApp

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "16.4"
  projectFormat: xcode16_0
  developmentLanguage: en
  defaultConfig: Release
  deploymentTarget:
    iOS: "17.6"

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: ZUP7Q36325
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true

fileGroups:
  - project.yml
  - README.md
  - AGENTS.md
  - docs
  - scripts

targets:
  WeatherApp:
    type: application
    platform: iOS
    sources:
      - path: WeatherApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jc.WeatherApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"WeatherApp/Preview Content"'
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: WeatherApp/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: true
        SWIFT_EMIT_LOC_STRINGS: true

  WeatherAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeatherAppTests
      # Tests resolve strings from their own bundle, just like the validator.
      - path: WeatherApp/Localization
        buildPhase: resources
    dependencies:
      - target: WeatherApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jc.WeatherAppTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WeatherApp.app/WeatherApp
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_EMIT_LOC_STRINGS: false

  WeatherAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeatherAppUITests
    dependencies:
      - target: WeatherApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jc.WeatherAppUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: WeatherApp
        SWIFT_EMIT_LOC_STRINGS: false

schemes:
  WeatherApp:
    build:
      targets:
        WeatherApp: all
        WeatherAppTests: [test]
        WeatherAppUITests: [test]
    run:
      config: Debug
      language: zh-Hant
    test:
      config: Debug
      targets:
        - WeatherAppTests
        - WeatherAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
